<!DOCTYPE html>
<html>
<head>
  <title>Trading Risk Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {font-family: Arial; padding:20px; background:#f2f2f2;}
    .box {background:white; padding:20px; border-radius:10px; max-width:400px; margin:auto;}
    input {width:100%; padding:10px; margin:8px 0; font-size:16px;}
    h2 {text-align:center;}
    .result {margin-top:15px; font-size:18px; font-weight:bold;}
  </style>
</head>
<body>
<div class="box">
  <h2>Risk → Lot Size Calculator</h2>

  <label>Account Balance (€)</label>
  <input type="number" id="balance">

  <label>Pip Value Per Lot (€)</label>
  <input type="number" id="pip">

  <label>Stop Loss (Pips)</label>
  <input type="number" id="sl">

  <label>Risk (%)</label>
  <input type="number" id="riskPercent" step="0.01">

  <div class="result" id="out"></div>
</div>

<script>
function calc(){
  let balance = parseFloat(document.getElementById('balance').value);
  let pip = parseFloat(document.getElementById('pip').value);
  let sl = parseFloat(document.getElementById('sl').value);
  let riskPercent = parseFloat(document.getElementById('riskPercent').value);

  if(balance && pip && sl && riskPercent){
    let riskMoney = balance * (riskPercent/100);
    let lotSize = riskMoney / (sl * pip);

    document.getElementById('out').innerHTML =
      "Lot Size: " + lotSize.toFixed(2) + "<br>" +
      "Risk €: " + riskMoney.toFixed(2);
  }
}

document.querySelectorAll('input').forEach(i => i.addEventListener('input', calc));
</script>
</body>
</html>
