<!DOCTYPE html>
<html>
<head>
  <title>Smart Risk Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {font-family: Arial; padding:20px; background:#f2f2f2;}
    .box {background:white; padding:20px; border-radius:10px; max-width:420px; margin:auto;}
    input {width:100%; padding:10px; margin:8px 0; font-size:16px;}
    h2 {text-align:center;}
    .result {margin-top:10px; font-weight:bold; font-size:18px;}
  </style>
</head>
<body>

<div class="box">
  <h2>Smart Risk Management</h2>

  <label>Account Balance ($)</label>
  <input type="number" id="balance" oninput="calculate()">

  <label>Pip Value Per Lot ($)</label>
  <input type="number" id="pip" oninput="calculate()">

  <label>SL Pips</label>
  <input type="number" id="sl" oninput="calculate()">

  <label>Lot Size</label>
  <input type="number" id="lot" step="0.01" oninput="calculate()">

  <label>Risk Per Trade ($)</label>
  <input type="number" id="riskMoney" step="0.01" oninput="calculate()">

  <div class="result">
    Risk Per Trade (%): <span id="riskPercent">0</span> %
  </div>
</div>

<script>
function calculate(){
  let balance = parseFloat(balanceEl.value);
  let pip = parseFloat(pipEl.value);
  let sl = parseFloat(slEl.value);
  let lot = parseFloat(lotEl.value);
  let risk = parseFloat(riskEl.value);

  if(!balance || !pip) return;

  // Count how many of sl, lot, risk are filled
  let filled = [sl, lot, risk].filter(v => !isNaN(v)).length;

  if(filled < 2) return;

  // If SL missing
  if(isNaN(sl) && lot && risk){
    sl = risk / (lot * pip);
    slEl.value = sl.toFixed(2);
  }

  // If LOT missing
  if(isNaN(lot) && sl && risk){
    lot = risk / (sl * pip);
    lotEl.value = lot.toFixed(2);
  }

  // If RISK missing
  if(isNaN(risk) && sl && lot){
    risk = lot * pip * sl;
    riskEl.value = risk.toFixed(2);
  }

  // Always update risk %
  if(risk){
    let riskPercent = (risk / balance) * 100;
    document.getElementById('riskPercent').innerText = riskPercent.toFixed(2);
  }
}

const balanceEl = document.getElementById('balance');
const pipEl = document.getElementById('pip');
const slEl = document.getElementById('sl');
const lotEl = document.getElementById('lot');
const riskEl = document.getElementById('riskMoney');
</script>

</body>
</html>
