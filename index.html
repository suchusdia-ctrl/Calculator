<!DOCTYPE html>
<html>
<head>
  <title>Risk Management Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {font-family: Arial; padding:20px; background:#f2f2f2;}
    .box {background:white; padding:20px; border-radius:10px; max-width:420px; margin:auto;}
    input {width:100%; padding:10px; margin:8px 0; font-size:16px;}
    h2 {text-align:center;}
    .result {margin-top:10px; font-weight:bold; font-size:18px;}
  </style>
</head>
<body>

<div class="box">
  <h2>Risk Management Calculator</h2>

  <label>Account Balance ($)</label>
  <input type="number" id="balance" oninput="calc()">

  <label>Pip Value Per Lot ($)</label>
  <input type="number" id="pip" oninput="calc()">

  <label>SL Pips</label>
  <input type="number" id="sl" step="0.01" oninput="calc()">

  <label>Lot Size</label>
  <input type="number" id="lot" step="0.01" oninput="calc()">

  <label>Risk Per Trade ($)</label>
  <input type="number" id="risk" step="0.01" oninput="calc()">

  <div class="result">
    Risk Per Trade (%): <span id="riskPercent">0</span> %
  </div>
</div>

<script>
function calc(){
  let balance = parseFloat(balanceEl.value);
  let pip = parseFloat(pipEl.value);
  let sl = parseFloat(slEl.value);
  let lot = parseFloat(lotEl.value);
  let risk = parseFloat(riskEl.value);

  // Short references
  const haveSL = !isNaN(sl);
  const haveLot = !isNaN(lot);
  const haveRisk = !isNaN(risk);

  // If SL + Lot → calculate Risk
  if(haveSL && haveLot){
    risk = lot * pip * sl;
    riskEl.value = risk.toFixed(2);
  }

  // If Risk + SL → calculate Lot
  if(haveRisk && haveSL){
    lot = risk / (pip * sl);
    lotEl.value = lot.toFixed(2);
  }

  // If Risk + Lot → calculate SL
  if(haveRisk && haveLot){
    sl = risk / (lot * pip);
    slEl.value = sl.toFixed(2);
  }

  // Risk %
  if(balance && risk){
    riskPercent.innerText = ((risk / balance) * 100).toFixed(2);
  }
}

// Element refs
const balanceEl = document.getElementById('balance');
const pipEl = document.getElementById('pip');
const slEl = document.getElementById('sl');
const lotEl = document.getElementById('lot');
const riskEl = document.getElementById('risk');
</script>

</body>
</html>
