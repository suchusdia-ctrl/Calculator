<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Risk Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; }
    h1 { font-size: 20px; text-align: center; }
    .row { display: flex; justify-content: space-between; margin: 8px 0; }
    label { flex: 1; margin-right: 10px; }
    input { flex: 1; padding: 4px; }
    .small { font-size: 12px; color: #666; }
    button { margin-top: 12px; width: 100%; padding: 8px; }
  </style>
</head>
<body>
  <h1>Risk Calculator</h1>

  <div class="row">
    <label for="balance">Account balance ($)</label>
    <input type="number" id="balance" step="0.01" />
  </div>

  <div class="row">
    <label for="pipValue">Pip value per lot ($)</label>
    <input type="number" id="pipValue" step="0.01" />
  </div>

  <div class="row">
    <label for="slPips">SL (pips)</label>
    <input type="number" id="slPips" step="0.01" />
  </div>

  <div class="row">
    <label for="lotSize">Lot size</label>
    <input type="number" id="lotSize" step="0.01" />
  </div>

  <div class="row">
    <label for="riskMoney">Risk per trade ($)</label>
    <input type="number" id="riskMoney" step="0.01" />
  </div>

  <div class="row">
    <label for="riskPercent">Risk per trade (%)</label>
    <input type="number" id="riskPercent" step="0.01" />
  </div>

  <p class="small">
    Formula: Risk $ = Lot size × Pip value per lot × SL pips.  
    Risk % = (Risk $ / Account balance) × 100.  
    Lot size = Risk $ ÷ (Pip value per lot × SL pips).
  </p>

  <button id="calcBtn">Calculate missing field(s)</button>

  <script>
    function toNum(id) {
      const v = document.getElementById(id).value;
      return v === "" ? null : Number(v);
    }

    function setIfEmpty(id, value) {
      const el = document.getElementById(id);
      if (el.value === "" && value != null && isFinite(value)) {
        el.value = Number(value.toFixed(2));
      }
    }

    document.getElementById("calcBtn").addEventListener("click", function () {
      const balance = toNum("balance");
      const pipValue = toNum("pipValue");
      const slPips = toNum("slPips");
      const lotSize = toNum("lotSize");
      const riskMoney = toNum("riskMoney");
      const riskPercent = toNum("riskPercent");

      // 1) If riskMoney, lotSize, slPips, pipValue known -> compute others
      if (lotSize != null && slPips != null && pipValue != null) {
        const calcRiskMoney = lotSize * slPips * pipValue;
        setIfEmpty("riskMoney", calcRiskMoney);

        if (balance != null) {
          const calcRiskPercent = (calcRiskMoney / balance) * 100;
          setIfEmpty("riskPercent", calcRiskPercent);
        }
      }

      // 2) If riskMoney known, with others:
      if (riskMoney != null) {
        // riskPercent
        if (balance != null) {
          const calcRiskPercent = (riskMoney / balance) * 100;
          setIfEmpty("riskPercent", calcRiskPercent);
        }

        // lotSize from riskMoney
        if (slPips != null && pipValue != null && (lotSize == null)) {
          const calcLot = riskMoney / (slPips * pipValue);
          setIfEmpty("lotSize", calcLot);
        }

        // slPips from riskMoney
        if (lotSize != null && pipValue != null && (slPips == null)) {
          const calcSl = riskMoney / (lotSize * pipValue);
          setIfEmpty("slPips", calcSl);
        }
      }

      // 3) If riskPercent known, balance known, but riskMoney empty:
      if (riskPercent != null && balance != null && riskMoney == null) {
        const calcRiskMoney = (riskPercent / 100) * balance;
        setIfEmpty("riskMoney", calcRiskMoney);

        // Then same logic as above for lot/sl
        const newRiskMoney = toNum("riskMoney");
        if (newRiskMoney != null) {
          if (slPips != null && pipValue != null && (lotSize == null)) {
            const calcLot = newRiskMoney / (slPips * pipValue);
            setIfEmpty("lotSize", calcLot);
          }
          if (lotSize != null && pipValue != null && (slPips == null)) {
            const calcSl = newRiskMoney / (lotSize * pipValue);
            setIfEmpty("slPips", calcSl);
          }
        }
      }
    });
  </script>
</body>
</html>
