<!DOCTYPE html>
<html>
<head>
  <title>Trading Risk Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {font-family: Arial; padding:20px; background:#f2f2f2;}
    .box {background:white; padding:20px; border-radius:10px; max-width:420px; margin:auto;}
    input {width:100%; padding:10px; margin:8px 0; font-size:16px;}
    h2 {text-align:center;}
    .result {margin-top:10px; font-weight:bold; font-size:18px;}
  </style>
</head>
<body>

<div class="box">
  <h2>Risk Management Calculator</h2>

  <label>Account Balance ($)</label>
  <input type="number" id="balance" oninput="recalculate()">

  <label>Pip Value Per Lot ($)</label>
  <input type="number" id="pip" oninput="recalculate()">

  <label>SL Pips</label>
  <input type="number" id="sl" step="0.01" oninput="fromSL()">

  <label>Lot Size</label>
  <input type="number" id="lot" step="0.01" oninput="fromLot()">

  <label>Risk Per Trade ($)</label>
  <input type="number" id="riskMoney" step="0.01" oninput="fromRisk()">

  <div class="result">
    Risk Per Trade (%): <span id="riskPercent">0</span> %
  </div>
</div>

<script>
function getValues(){
  return {
    balance: parseFloat(document.getElementById('balance').value),
    pip: parseFloat(document.getElementById('pip').value),
    sl: parseFloat(document.getElementById('sl').value),
    lot: parseFloat(document.getElementById('lot').value),
    risk: parseFloat(document.getElementById('riskMoney').value)
  };
}

function updateRiskPercent(risk, balance){
  if(balance && risk){
    document.getElementById('riskPercent').innerText =
      ((risk / balance) * 100).toFixed(2);
  }
}

function fromLot(){
  let {balance, pip, sl, lot} = getValues();
  if(balance && pip && sl && lot){
    let risk = lot * pip * sl;
    document.getElementById('riskMoney').value = risk.toFixed(2);
    updateRiskPercent(risk, balance);
  }
}

function fromRisk(){
  let {balance, pip, sl, risk} = getValues();
  if(balance && pip && sl && risk){
    let lot = risk / (pip * sl);
    document.getElementById('lot').value = lot.toFixed(2);
    updateRiskPercent(risk, balance);
  }
}

function fromSL(){
  let {balance, pip, lot, risk} = getValues();
  if(balance && pip && lot && risk){
    let sl = risk / (lot * pip);
    document.getElementById('sl').value = sl.toFixed(2);
    updateRiskPercent(risk, balance);
  }
}

function recalculate(){
  // triggers correct recalculation when balance or pip changes
  fromLot();
  fromRisk();
  fromSL();
}
</script>

</body>
</html>
