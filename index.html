<!DOCTYPE html>
<html>
<head>
  <title>Risk Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {font-family: Arial; padding:20px; background:#f2f2f2;}
    .box {background:white; padding:20px; border-radius:10px; max-width:420px; margin:auto;}
    input {width:100%; padding:10px; margin:8px 0; font-size:16px;}
    h2 {text-align:center;}
    .result {margin-top:10px; font-weight:bold; font-size:18px;}
  </style>
</head>
<body>

<div class="box">
  <h2>Risk Management Calculator</h2>

  <label>Account Balance ($)</label>
  <input type="number" id="balance">

  <label>Pip Value Per Lot ($)</label>
  <input type="number" id="pip">

  <label>SL Pips</label>
  <input type="number" id="sl">

  <label>Lot Size</label>
  <input type="number" id="lot" step="0.01">

  <label>Risk Per Trade ($)</label>
  <input type="number" id="risk">

  <div class="result">
    Risk Per Trade (%): <span id="riskPercent">0</span> %
  </div>
</div>

<script>
const balance = document.getElementById('balance');
const pip = document.getElementById('pip');
const sl = document.getElementById('sl');
const lot = document.getElementById('lot');
const risk = document.getElementById('risk');
const riskPercent = document.getElementById('riskPercent');

function updatePercent(r){
  if(balance.value){
    riskPercent.innerText = ((r / balance.value) * 100).toFixed(2);
  }
}

// LOT changed → calculate Risk
lot.addEventListener('change', () => {
  if(pip.value && sl.value && lot.value){
    let r = lot.value * pip.value * sl.value;
    risk.value = r.toFixed(2);
    updatePercent(r);
  }
});

// RISK changed → calculate Lot
risk.addEventListener('change', () => {
  if(pip.value && sl.value && risk.value){
    let l = risk.value / (pip.value * sl.value);
    lot.value = l.toFixed(2);
    updatePercent(risk.value);
  }
});

// SL changed → smart behavior
sl.addEventListener('change', () => {
  // If lot exists → update risk
  if(pip.value && lot.value){
    let r = lot.value * pip.value * sl.value;
    risk.value = r.toFixed(2);
    updatePercent(r);
  }
  // If risk exists → update lot
  else if(pip.value && risk.value){
    let l = risk.value / (pip.value * sl.value);
    lot.value = l.toFixed(2);
    updatePercent(risk.value);
  }
});
</script>

</body>
</html>
