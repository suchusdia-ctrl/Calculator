<!DOCTYPE html>
<html>
<head>
  <title>Risk Management Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {font-family: Arial; padding:20px; background:#f2f2f2;}
    .box {background:white; padding:20px; border-radius:10px; max-width:420px; margin:auto;}
    input {width:100%; padding:10px; margin:8px 0; font-size:16px;}
    h2 {text-align:center;}
    .result {margin-top:10px; font-weight:bold; font-size:18px;}
  </style>
</head>
<body>

<div class="box">
  <h2>Risk Management Calculator</h2>

  <label>Account Balance ($)</label>
  <input type="number" id="balance" oninput="calculate('base')">

  <label>Pip Value Per Lot ($)</label>
  <input type="number" id="pip" oninput="calculate('base')">

  <label>SL Pips</label>
  <input type="number" id="sl" step="0.01" oninput="calculate('sl')">

  <label>Lot Size</label>
  <input type="number" id="lot" step="0.01" oninput="calculate('lot')">

  <label>Risk Per Trade ($)</label>
  <input type="number" id="riskMoney" step="0.01" oninput="calculate('risk')">

  <div class="result">
    Risk Per Trade (%): <span id="riskPercent">0</span> %
  </div>
</div>

<script>
function getVals(){
  return {
    balance: parseFloat(balance.value),
    pip: parseFloat(pip.value),
    sl: parseFloat(sl.value),
    lot: parseFloat(lot.value),
    risk: parseFloat(riskMoney.value)
  };
}

function setRiskPercent(risk, balance){
  if(balance && risk){
    riskPercent.innerText = ((risk / balance) * 100).toFixed(2);
  }
}

function calculate(changed){
  let {balance, pip, sl, lot, risk} = getVals();
  if(!balance || !pip) return;

  // If Lot changed → compute Risk
  if(changed === 'lot' && sl){
    risk = lot * pip * sl;
    riskMoney.value = risk.toFixed(2);
  }

  // If Risk changed → compute Lot
  if(changed === 'risk' && sl){
    lot = risk / (pip * sl);
    lot.value = lot.toFixed(2);
  }

  // If SL changed → compute Risk
  if(changed === 'sl' && lot){
    risk = lot * pip * sl;
    riskMoney.value = risk.toFixed(2);
  }

  // If base values changed → recompute from Lot if exists
  if(changed === 'base' && lot && sl){
    risk = lot * pip * sl;
    riskMoney.value = risk.toFixed(2);
  }

  setRiskPercent(parseFloat(riskMoney.value), balance);
}
</script>

</body>
</html>
