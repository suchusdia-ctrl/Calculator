<!DOCTYPE html>
<html>
<head>
  <title>Trading Risk Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {font-family: Arial; padding:20px; background:#f2f2f2;}
    .box {background:white; padding:20px; border-radius:10px; max-width:420px; margin:auto;}
    input {width:100%; padding:10px; margin:8px 0; font-size:16px;}
    h2 {text-align:center;}
    .result {margin-top:10px; font-weight:bold; font-size:18px;}
  </style>
</head>
<body>

<div class="box">
  <h2>Risk Management Calculator</h2>

  <label>Account Balance ($)</label>
  <input type="number" id="balance" oninput="updateFromLot(); updateFromRisk();">

  <label>Pip Value Per Lot ($)</label>
  <input type="number" id="pip" oninput="updateFromLot(); updateFromRisk();">

  <label>SL Pips</label>
  <input type="number" id="sl" oninput="updateFromLot(); updateFromRisk();">

  <label>Lot Size</label>
  <input type="number" id="lot" step="0.01" oninput="updateFromLot()">

  <label>Risk Per Trade ($)</label>
  <input type="number" id="riskMoney" step="0.01" oninput="updateFromRisk()">

  <div class="result">
    Risk Per Trade (%): <span id="riskPercent">0</span> %
  </div>
</div>

<script>
function updateFromLot(){
  let balance = parseFloat(document.getElementById('balance').value);
  let pip = parseFloat(document.getElementById('pip').value);
  let sl = parseFloat(document.getElementById('sl').value);
  let lot = parseFloat(document.getElementById('lot').value);

  if(balance && pip && sl && lot){
    let riskMoney = lot * pip * sl;
    let riskPercent = (riskMoney / balance) * 100;

    document.getElementById('riskMoney').value = riskMoney.toFixed(2);
    document.getElementById('riskPercent').innerText = riskPercent.toFixed(2);
  }
}

function updateFromRisk(){
  let balance = parseFloat(document.getElementById('balance').value);
  let pip = parseFloat(document.getElementById('pip').value);
  let sl = parseFloat(document.getElementById('sl').value);
  let riskMoney = parseFloat(document.getElementById('riskMoney').value);

  if(balance && pip && sl && riskMoney){
    let lot = riskMoney / (pip * sl);
    let riskPercent = (riskMoney / balance) * 100;

    document.getElementById('lot').value = lot.toFixed(2);
    document.getElementById('riskPercent').innerText = riskPercent.toFixed(2);
  }
}
</script>

</body>
</html>
